<!-- tour-overlay.component.html -->
<ng-container *ngIf="isActive && currentStep">
  <!-- Dark backdrop with spotlight cutout -->
  <div class="tour-backdrop" (click)="onBackdropClick()">
    <svg class="tour-spotlight" [attr.viewBox]="svgViewBox" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
      <defs>
        <mask id="tour-spotlight-mask">
          <rect width="100%" height="100%" fill="white" />
          <rect
            [attr.x]="spotlightRect.x"
            [attr.y]="spotlightRect.y"
            [attr.width]="spotlightRect.width"
            [attr.height]="spotlightRect.height"
            [attr.rx]="spotlightRect.rx"
            fill="black"
          />
        </mask>
      </defs>
      <rect width="100%" height="100%" fill="rgba(0,0,0,0.65)" mask="url(#tour-spotlight-mask)" />
    </svg>
  </div>

  <!-- Tooltip bubble -->
  <div
    class="tour-tooltip"
    [ngClass]="tooltipPositionClass"
    [ngStyle]="tooltipStyle"
    @tooltipAnimation
  >
    <!-- Header -->
    <div class="tour-tooltip-header">
      <div class="tour-step-indicator">
        <span class="tour-step-dot" *ngFor="let s of stepsArray; let i = index"
          [class.active]="i === currentStepIndex"
          (click)="goToStep(i)">
        </span>
      </div>
      <button class="tour-close-btn" (click)="skip()" [title]="'TOUR.SKIP' | translate">
        <span class="tour-close-icon">✕</span>
      </button>
    </div>

    <!-- Content -->
    <div class="tour-tooltip-body">
      <h3 class="tour-step-title">{{ currentStep.title | translate }}</h3>
      <p class="tour-step-content">{{ currentStep.content | translate }}</p>
    </div>

    <!-- Footer -->
    <div class="tour-tooltip-footer">
      <button class="tour-btn tour-btn-secondary" *ngIf="currentStepIndex > 0" (click)="prev()">
        ← {{ 'TOUR.BACK' | translate }}
      </button>
      <div class="tour-footer-right">
        <button class="tour-btn tour-btn-ghost" (click)="skip()">
          {{ 'TOUR.SKIP' | translate }}
        </button>
        <button class="tour-btn tour-btn-primary" (click)="onNextClick()">
          {{ currentStep.nextButtonText ? (currentStep.nextButtonText | translate) : (isLastStep ? (('TOUR.FINISH' | translate) + ' 🎉') : (('TOUR.NEXT' | translate) + ' →')) }}
        </button>
      </div>
    </div>

    <!-- Pointer arrow -->
    <div class="tour-arrow" [ngClass]="arrowPositionClass"></div>
  </div>
</ng-container>

<button *ngIf="!isActive && showRetakeBubble" class="tour-retake-fab" (click)="retakeTour()">
  <span class="tour-retake-icon">?</span>
  <span class="tour-retake-label">{{ 'TOUR.TAKE_AGAIN' | translate }}</span>
</button>
