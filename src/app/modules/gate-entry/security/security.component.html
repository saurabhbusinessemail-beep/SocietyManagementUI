<app-layout [hideMoreActions]="true" [pageTitle]="'SECURITY.PAGE_TITLE' | translate">

    <form [formGroup]="entryForm">

        <ui-form-layout>

            <ui-tabs [config]="tabsConfig" [tabs]="tabsOptions" [formControl]="tabControl" height="100%"
                [smColumns]="12" [mdColumns]="12" [lgColumns]="12">

                <ng-template uiTab="entry">
                    <br>
                    <br class="no-mobile">
                    <ui-form-layout>

                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>
                        <section class="flex flex-gap" [smColumns]="12" [mdColumns]="6" [lgColumns]="4">
                            <ui-button [label]="'SECURITY.SCAN_QR' | translate" type="only-content" (clicked)="scanQRCode()">
                                <app-icon name="qr-code" size="md"></app-icon>
                            </ui-button>
                            <ui-button [label]="'SECURITY.ENTER_OTP' | translate" type="only-content" (clicked)="enterOTP()"
                                [disable]="!isSocietySelected">
                            </ui-button>
                        </section>
                        <div class="no-mobile" [mdColumns]="9" [lgColumns]="6"></div>

                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>

                        <!-- Society -->
                        <ui-select2 formControlName="society" [config]="societyConfig" [options]="societyOptions"
                            placeholder="" [smColumns]="12" [mdColumns]="6" [lgColumns]="4">
                        </ui-select2>

                        <!-- Flat -->
                        <div class="control-container" [smColumns]="12" [mdColumns]="6" [lgColumns]="4">
                            <ui-select2 formControlName="flat" [config]="flatConfig" [options]="flatOptions"
                                placeholder="">
                            </ui-select2>
                            <div class="loading-spinner-overlay" *ngIf="isLoadingFlats">
                                <div class="spinner"></div>
                            </div>
                        </div>
                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>




                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>
                        <!-- Visitor Name -->
                        <ui-text-box formControlName="visitorName" [config]="visitorNameConfig" [smColumns]="12"
                            [mdColumns]="6" [lgColumns]="8">
                        </ui-text-box>
                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>

                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>
                        <!-- Visitor Country -->
                        <ui-search-box formControlName="visitorCountry" [config]="visitorCountryConfig"
                            [options]="countryService.filteredCountryCallingOptions"
                            [defaultSelectedValue]="countryService.loggedInUserCountryCallingOption"
                            (searchChange)="onSearchChange($event)" [smColumns]="12" [mdColumns]="6" [lgColumns]="4">
                        </ui-search-box>

                        <!-- Visitor Contact -->
                        <ui-text-box formControlName="visitorContact" [config]="visitorContactConfig" [smColumns]="12"
                            [mdColumns]="6" [lgColumns]="4">
                        </ui-text-box>
                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>




                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>
                        <!-- Vehicle Number -->
                        <ui-text-box formControlName="vehicleNumber" [config]="vehicleNumberConfig" [smColumns]="12"
                            [mdColumns]="6" [lgColumns]="4">
                        </ui-text-box>

                        <!-- Purpose -->
                        <ui-text-box formControlName="purpose" [config]="purposeConfig" [smColumns]="12" [mdColumns]="6"
                            [lgColumns]="4">
                        </ui-text-box>

                        <div class="no-mobile no-tablet" [lgColumns]="2"></div>



                        <div class="no-mobile" [mdColumns]="3" [lgColumns]="4"></div>
                        <section class="flex flex-end flex-gap flex-wrap" [smColumns]="12" [mdColumns]="12"
                            [lgColumns]="10">
                            <ui-button [label]="'SECURITY.REQUEST_APPROVAL' | translate" type="only-content" (clicked)="requestApproval()"
                                [disable]="!isFlatSelected || !isSocietySelected || entryForm.invalid">
                            </ui-button>
                            <ui-button [label]="'SECURITY.SELF_APPROVE' | translate" type="only-content" (clicked)="selfApprove()"
                                [disable]="!isSocietySelected || entryForm.invalid">
                            </ui-button>
                        </section>
                        <div class="no-mobile" [mdColumns]="3" [lgColumns]="4"></div>


                    </ui-form-layout>
                    <br>
                    <ui-form-layout>
                        <ui-loading *ngIf="loadingApprovals" [message]="'SECURITY.LOADING_PENDING_ENTRIES' | translate"></ui-loading>

                        <ng-container *ngIf="!loadingApprovals">
                            <ng-container *ngFor="let gateEntry of pendingApprovals">
                                <app-gate-entry-card [gateEntry]="gateEntry"
                                    (openDetails)="openGateEntryDetails(gateEntry)"
                                    (resendRequest)="resendNotification(gateEntry)" [smColumns]="12" [mdColumns]="6"
                                    [lgColumns]="6">
                                </app-gate-entry-card>
                            </ng-container>

                            <ng-container *ngIf="pendingApprovals.length === 0">
                                <app-empty-records singular="security approval" plural="security approvals"
                                    [hideAddButton]="true" [overrideTitle]="'SECURITY.NO_PENDING_APPROVALS' | translate"
                                    [hideMessage]="true" [smColumns]="12" [mdColumns]="12" [lgColumns]="12">
                                    <app-icon icon name="security" size="xxl"></app-icon>
                                </app-empty-records>
                            </ng-container>
                        </ng-container>
                    </ui-form-layout>
                </ng-template>

                <ng-template uiTab="exit">
                    <br>
                    <br class="no-mobile">
                    <ui-form-layout>
                        <ui-loading *ngIf="loadingExits" [message]="'SECURITY.LOADING_PENDING_EXITS' | translate"></ui-loading>

                        <ng-container *ngIf="!loadingExits">
                            <ng-container *ngFor="let gateEntry of pendingExits">
                                <app-gate-entry-card [gateEntry]="gateEntry"
                                    (openDetails)="openGateEntryDetails(gateEntry)" (markExit)="markGateExit(gateEntry)"
                                    [showApprovalAction]="true" [smColumns]="12" [mdColumns]="6" [lgColumns]="6">
                                </app-gate-entry-card>
                            </ng-container>

                            <ng-container *ngIf="pendingExits.length === 0">
                                <app-empty-records singular="security exit" plural="security exits" [hideAddButton]="true"
                                    [overrideTitle]="'SECURITY.NO_ACTIVE_SECURITY' | translate" [hideMessage]="true"
                                    [smColumns]="12" [mdColumns]="12" [lgColumns]="12">
                                    <app-icon icon name="security" size="xxl"></app-icon>
                                </app-empty-records>
                            </ng-container>
                        </ng-container>
                    </ui-form-layout>
                </ng-template>

            </ui-tabs>

        </ui-form-layout>

    </form>



</app-layout>
