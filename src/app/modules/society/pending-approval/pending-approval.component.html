<app-layout [hideMoreActions]="isAdmin" [pageTitle]="'APPROVALS.PAGE_TITLE' | translate">

    <ng-container moreActions>
        <ul class="page-menu-list" *ngIf="!isAdmin">
            <li class="page-menu" (click)="gotoAddSociety()">{{ 'APPROVALS.NEW_SOCIETY' | translate }}</li>
        </ul>
    </ng-container>

    <ui-tabs [tabs]="tabsOptions" [tab]="routeTabId" (tabChange)="handleTabChange($event)">

        <!-- Societies Approval -->
        <ng-template uiTab="societies">
            <app-pending-society-approvals></app-pending-society-approvals>
        </ng-template>
        
        <!-- Flats Approval -->
        <ng-template uiTab="flats">
            <app-pending-flat-approvals requestType="FlatMember"></app-pending-flat-approvals>
        </ng-template>
        
        <!-- Security Approval -->
        <ng-template uiTab="security">
            <app-pending-flat-approvals requestType="Security"></app-pending-flat-approvals>
        </ng-template>

    </ui-tabs>

</app-layout>
