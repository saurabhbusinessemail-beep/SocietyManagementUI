<app-layout [pageTitle]="'VEHICLES.TITLE' | translate" [subTitle]="societyService.selectedSocietyFilterValue?.label">

    <ng-container moreActions>
        <!-- <ui-button label="New Vehicle" type="primary" (clicked)="openAddDialog()" [smColumns]="1" [mdColumns]="1"
            [lgColumns]="1">
        </ui-button> -->
        <ul class="page-menu-list">
            <li class="page-menu" (click)="openAddDialog()">{{ 'VEHICLES.NEW_VEHICLE' | translate }}</li>
        </ul>
    </ng-container>


    <div class="flex-col full-h">
        <app-filter [dropDownControlConfigs]="[]" (isFlatMemberChanged)="isFlatMember=$event" [selectedFlatId]="flatId"
            [flatSearchConfig]="flatSearchConfig" [loadFirstSociety]="true" [loadFirstFlat]="true"
            [supressAdminManageFlats]="true" [smColumns]="12" [mdColumns]="12" [lgColumns]="12"
            (filterChanged)="handleFilterChange($event)">
        </app-filter>

        <ui-form-layout class="flex-auto">

            <ng-container *ngIf="!loadingVehicles">

                <ng-container *ngFor=" let vehicle of vehicles">
                    <ui-vehicle-card [vehicle]="vehicle" [actionInProgress]="loadingVehicleAction[vehicle._id]"
                        [smColumns]="12" [mdColumns]="6" [lgColumns]="6" [showDelete]="true"
                        (delete)="deleteVehicle(vehicle)">
                    </ui-vehicle-card>
                </ng-container>

                <ng-container *ngIf="vehicles.length === 0">
                    <app-empty-records [singular]="'VEHICLES.SINGULAR'" [plural]="'VEHICLES.PLURAL'" (addClicked)="openAddDialog()" [smColumns]="12"
                        [mdColumns]="12" [lgColumns]="12">
                        <app-icon icon name="vehicle" size="xxl"></app-icon>
                    </app-empty-records>
                </ng-container>

            </ng-container>


            <ui-loading *ngIf="loadingVehicles" [message]="'VEHICLES.LOADING' | translate" [smColumns]="12" [mdColumns]="12"
                [lgColumns]="12">
            </ui-loading>

        </ui-form-layout>
    </div>

</app-layout>

<ng-template #vehicleTemplate>
    <form [formGroup]="fb">
        <app-add-edit-popup [title]="'VEHICLES.ADD_VEHICLE' | translate" (onClose)="closeDialog();">


            <ng-container>

                <ui-loading [message]="'APP.LOADING' | translate" *ngIf="savingVehicle"></ui-loading>

                <ui-form-layout *ngIf="!savingVehicle">


                    <ui-drop-down formControlName="flat" [config]="flatSearchConfig"
                        [options]="flatSearchConfig.dropDownOptions ?? []" [placeholder]="'PARKINGS.SELECT_FLAT' | translate" [smColumns]="12"
                        [mdColumns]="6" [lgColumns]="3">
                    </ui-drop-down>

                    <ui-text-box formControlName="vehicleNumber" [config]="vehicleNumberConfig" [smColumns]="12"
                        [mdColumns]="6" [lgColumns]="3">
                    </ui-text-box>

                    <ui-drop-down formControlName="vehicleType" [config]="vehicleTypeConfig"
                        [options]="vehicleTypeConfig.dropDownOptions ?? []" [placeholder]="'VEHICLES.SELECT_VEHICLE_TYPE' | translate"
                        [smColumns]="12" [mdColumns]="6" [lgColumns]="3">
                    </ui-drop-down>

                </ui-form-layout>

            </ng-container>

            <ng-container actions>
                <ui-button [label]="'APP.CANCEL' | translate" type="cancel" (clicked)="closeDialog();">
                </ui-button>
                <ui-button [label]="'APP.ADD' | translate" [smColumns]="12" [mdColumns]="2" [lgColumns]="2" [disable]="fb.invalid || savingVehicle"
                    (clicked)="saveVehicle()">
                </ui-button>
            </ng-container>

        </app-add-edit-popup>

    </form>
</ng-template>
